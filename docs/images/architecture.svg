  <rect class="node" x="525" y="87" width="350" height="66"/>
  <rect class="node" x="970" y="87" width="350" height="66"/>
  <text class="head" x="255" y="128" text-anchor="middle">桌面端 / 浏览器</text>
  <text class="head" x="700" y="128" text-anchor="middle">openworkbuddy CLI</text>
  <text class="head" x="1145" y="128" text-anchor="middle">飞书 / 微信等 IM</text>

  <rect class="band" x="38" y="207" width="1324" height="166" rx="18"/>
  <text class="section" x="64" y="240">应用宿主</text>
  <rect class="node" x="55" y="263" width="290" height="82"/>
  <rect class="node" x="385" y="263" width="290" height="82"/>
  <rect class="node" x="715" y="263" width="290" height="82"/>
  <rect class="node" x="1045" y="263" width="300" height="82"/>
  <text class="head" x="200" y="297" text-anchor="middle">Web 服务</text><text class="sub" x="200" y="326" text-anchor="middle">server.js · Express API</text>
  <text class="head" x="530" y="297" text-anchor="middle">CLI 交互</text><text class="sub" x="530" y="326" text-anchor="middle">cli.js · 终端 REPL</text>
  <text class="head" x="860" y="297" text-anchor="middle">IM 桥接</text><text class="sub" x="860" y="326" text-anchor="middle">消息收发与任务转发</text>
  <text class="head" x="1195" y="297" text-anchor="middle">定时调度器</text><text class="sub" x="1195" y="326" text-anchor="middle">由 Web 服务注册与触发</text>

