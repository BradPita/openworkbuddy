  <path class="line" d="M700 153 V263"/>
  <path class="line" d="M1145 153 V224 H860 V263"/>
  <path class="line" d="M345 305 H370 V395 H540"/>
  <path class="line" d="M530 345 V395 H620"/>
  <path class="line" d="M860 345 V395 H780"/>
  <path class="line" d="M1195 345 V395 H860"/>

  <rect class="runtime" x="420" y="395" width="560" height="116"/>
  <text class="runtimeHead" x="700" y="444" text-anchor="middle">Agent Runtime</text>
  <text class="runtimeSub" x="700" y="477" text-anchor="middle">src/agent/agent.js · createAgentRuntime · runTask</text>

  <text class="section" x="64" y="572">运行时协作模块</text>
  <path class="line" d="M700 511 V592 H156 V625"/>
  <path class="line" d="M700 511 V592 H426 V625"/>
  <path class="line" d="M700 511 V625"/>
  <path class="line" d="M700 511 V592 H974 V625"/>
  <path class="line" d="M700 511 V592 H1244 V625"/>
