<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1050" role="img" aria-labelledby="title desc">
  <title id="title">OpenWorkBuddy 技术架构</title>
  <desc id="desc">入口与应用宿主调用 Agent Runtime；Runtime 协调模型、安全审批、工具、项目上下文、成果交付和执行追踪。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#65708a"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#20263a}
      .bg{fill:#f8f9ff}.band{fill:#f0f2ff;stroke:#d9def3;stroke-width:2}.node{fill:#fff;stroke:#8570ef;stroke-width:2;rx:14}.runtime{fill:#ece9ff;stroke:#6952df;stroke-width:3;rx:18}
      .line{fill:none;stroke:#65708a;stroke-width:2.5;marker-end:url(#arrow)}.dashed{fill:none;stroke:#8b93a7;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#arrow)}
      .section{font-size:20px;font-weight:700;fill:#59627b;letter-spacing:1px}.head{font-size:23px;font-weight:700}.sub{font-size:17px;fill:#606982}.runtimeHead{font-size:29px;font-weight:750}.runtimeSub{font-size:18px;fill:#535c78}.note{font-size:17px;fill:#525d78}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1400" height="1050" rx="20"/>

  <rect class="band" x="38" y="32" width="1324" height="145" rx="18"/>
