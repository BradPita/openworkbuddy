  <text class="head" x="156" y="670" text-anchor="middle">模型与执行引擎</text><text class="sub" x="156" y="704" text-anchor="middle">云端 LLM · Ollama</text><text class="sub" x="156" y="730" text-anchor="middle">Codex · Claude Code</text>
  <text class="head" x="426" y="670" text-anchor="middle">安全检查与审批</text><text class="sub" x="426" y="704" text-anchor="middle">core/safety · agent/gates</text><text class="sub" x="426" y="730" text-anchor="middle">批准后调用工具</text>
  <text class="head" x="700" y="670" text-anchor="middle">会话与项目上下文</text><text class="sub" x="700" y="704" text-anchor="middle">历史 · 工作区 · 记忆</text><text class="sub" x="700" y="730" text-anchor="middle">本机 data/ 与项目目录</text>
  <text class="head" x="974" y="670" text-anchor="middle">成果交付</text><text class="sub" x="974" y="704" text-anchor="middle">工作区文件 · 画布</text><text class="sub" x="974" y="730" text-anchor="middle">预览与导出</text>
  <text class="head" x="1244" y="670" text-anchor="middle">执行 Trace</text><text class="sub" x="1244" y="704" text-anchor="middle">模型 · 工具 · 耗时</text><text class="sub" x="1244" y="730" text-anchor="middle">Token 用量</text>

  <path class="line" d="M426 757 V795"/>
  <rect class="node" x="308" y="795" width="236" height="98"/>
  <text class="head" x="426" y="835" text-anchor="middle">工具与扩展</text><text class="sub" x="426" y="866" text-anchor="middle">内置工具 · MCP · Skills · 专家</text>
  <path class="dashed" d="M1244 757 V840 H1080"/>
  <rect class="node" x="790" y="812" width="290" height="70"/>
  <text class="head" x="935" y="856" text-anchor="middle">可选：上报 Langfuse</text>

  <text class="note" x="700" y="963" text-anchor="middle">任务由 Agent Runtime 统一编排；模块间交互关系以实际代码入口和调用为准。</text>
</svg>
